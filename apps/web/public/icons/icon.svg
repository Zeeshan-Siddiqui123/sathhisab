<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E9382" />
      <stop offset="100%" stop-color="#075C51" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2F5F1" />
    </linearGradient>
  </defs>

  <!-- Background Squircle with Subtle Lighting -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Subtle tactile ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Center Symbol: Stylized Split Balance / Shared Ledger Coin -->
  <g filter="url(#shadow)" transform="translate(96, 96)">
    <!-- Left Hand / Settle Balance Half -->
    <path d="M 120 40 L 60 40 C 35 40 16 59 16 84 L 16 236 C 16 261 35 280 60 280 L 120 280 C 130 280 138 272 138 262 L 138 58 C 138 48 130 40 120 40 Z" fill="url(#glyphGrad)" opacity="0.95" />
    
    <!-- Right Hand / Active Expense Half with Shift -->
    <path d="M 200 40 L 260 40 C 285 40 304 59 304 84 L 304 236 C 304 261 285 280 260 280 L 200 280 C 190 280 182 272 182 262 L 182 58 C 182 48 190 40 200 40 Z" fill="url(#glyphGrad)" />

    <!-- Center Bridge (Split equal sign / Ledger Balance Bars) -->
    <rect x="76" y="120" width="168" height="24" rx="12" fill="#063E37" />
    <rect x="76" y="176" width="168" height="24" rx="12" fill="#063E37" />
    <circle cx="160" cy="160" r="14" fill="#2CC5AF" />
  </g>
</svg>
